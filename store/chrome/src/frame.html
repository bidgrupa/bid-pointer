<!doctype html>
<!-- One 1280×800 store screenshot: a caption over a browser window showing Pointer at work, in
     webpify's layout. render.mjs opens it as frame.html?shot=1…5 once it has photographed the
     page for that shot as capture-<n>.png. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>bid Pointer screenshot</title>
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <style>
      @font-face {
        font-family: 'Pointer Gilroy';
        src: url('/fonts/Gilroy-Medium.otf') format('opentype');
        font-weight: 500;
      }
      @font-face {
        font-family: 'Pointer Gilroy';
        src: url('/fonts/Gilroy-Bold.otf') format('opentype');
        font-weight: 700;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 1280px;
        height: 800px;
        margin: 0;
        overflow: hidden;
      }
      body {
        position: relative;
        background:
          radial-gradient(900px 420px at 100% 0%, rgba(255, 161, 115, 0.22), transparent 70%),
          var(--ink);
        color: var(--paper);
        font-family: var(--font);
        -webkit-font-smoothing: antialiased;
      }
      .caption {
        position: absolute;
        top: 46px;
        left: 72px;
        right: 72px;
      }
      h1 {
        margin: 0;
        font-size: 40px;
        font-weight: 700;
        line-height: 1.15;
        letter-spacing: -0.01em;
      }
      h1 em {
        background: var(--gold);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        font-style: normal;
      }
      .caption p {
        max-width: 820px;
        margin: 10px 0 0;
        color: rgba(253, 252, 252, 0.72);
        font-size: 18px;
        font-weight: 500;
        line-height: 1.45;
      }
      .window {
        position: absolute;
        top: 186px;
        left: 72px;
        right: 72px;
        bottom: -14px;
        overflow: hidden;
        border-radius: 12px 12px 0 0;
        background: #fff;
        box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.6);
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 14px;
        height: 46px;
        padding: 0 12px 0 18px;
        background: #ebeaf0;
        color: #4a4d57;
        font: 13px/1 system-ui, sans-serif;
      }
      .dots {
        display: flex;
        gap: 8px;
      }
      .dots i {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #ff5f57;
      }
      .dots i:nth-child(2) {
        background: #febc2e;
      }
      .dots i:nth-child(3) {
        background: #28c840;
      }
      .url {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 1;
        height: 30px;
        padding: 0 14px;
        border-radius: 999px;
        background: #fff;
      }
      .url svg,
      .tool svg {
        width: 15px;
        height: 15px;
        flex: none;
      }
      .tool {
        display: grid;
        place-items: center;
        width: 32px;
        height: 30px;
        border-radius: 8px;
      }
      .tool img {
        width: 18px;
        height: 18px;
      }
      .page {
        display: block;
        width: 1136px;
        height: 582px;
      }
    </style>
  </head>
  <body>
    <header class="caption">
      <h1></h1>
      <p></p>
    </header>
    <div class="window">
      <div class="bar">
        <span class="dots"><i></i><i></i><i></i></span>
        <span class="url">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <rect x="3.5" y="7" width="9" height="6.5" rx="1.5" />
            <path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2" />
          </svg>
          <span id="url"></span>
        </span>
        <span class="tool" title="Extensions">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 2.5h2.5v1.5a1.25 1.25 0 0 0 2.5 0V2.5h2.5V6h-1.5a1.25 1.25 0 0 0 0 2.5h1.5v5H10V12a1.25 1.25 0 0 0-2.5 0v1.5H2.5V8.5H4a1.25 1.25 0 0 0 0-2.5H2.5v-3.5z" />
          </svg>
        </span>
        <span class="tool"><img src="/icons/48.png" alt="bid Pointer" /></span>
      </div>
      <img class="page" id="page" alt="" />
    </div>
    <script>
      // The words, and the address shown in the window; render.mjs takes the shots in this order.
      const SHOTS = {
        1: {
          title: "Click what's <em>wrong</em>. Say why.",
          text: 'Point at anything on a page and write a note. Pointer files it in ClickUp with a marked-up screenshot, the page and the browser.',
          url: 'staging.hotel-lumen.example/rooms/sea-view',
        },
        2: {
          title: 'Several notes, <em>one</em> task',
          text: 'Collect notes on a page as numbered pins, then publish them together as one ClickUp task.',
          url: 'staging.hotel-lumen.example/rooms/sea-view',
        },
        3: {
          title: 'A clear task, <em>before</em> it goes out',
          text: 'Optional AI rewriting turns a quick note into a short title and clear steps. Check it, change it, then send it to ClickUp.',
          url: 'staging.hotel-lumen.example/rooms/sea-view',
        },
        4: {
          title: 'The page the way <em>Google</em> reads it',
          text: 'The SEO check shows what to fix and improve, with a preview of the Google result, and sends it as one task.',
          url: 'staging.hotel-lumen.example/rooms/sea-view',
        },
        5: {
          title: 'Set up in a <em>minute</em>',
          text: "Connect ClickUp with your own token and paste your team's setup code. Pointer sends nothing until you agree.",
          url: 'bid Pointer settings',
        },
      };
      const n = new URLSearchParams(location.search).get('shot') ?? '1';
      const shot = SHOTS[n];
      document.querySelector('h1').innerHTML = shot.title;
      document.querySelector('.caption p').textContent = shot.text;
      document.getElementById('url').textContent = shot.url;
      const page = document.getElementById('page');
      const loaded = new Promise((resolve) => page.addEventListener('load', resolve, { once: true }));
      page.src = `capture-${n}.png`;
      /** Awaited by render.mjs before it takes the picture. */
      window.ready = Promise.all([loaded, document.fonts.ready]);
    </script>
  </body>
</html>
