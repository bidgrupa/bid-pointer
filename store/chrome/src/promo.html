<!doctype html>
<!-- The 440×280 small promo tile. Google asks for no text, saturated colours and a filled tile, so
     it's Pointer's pin on its own, drawn the way the interface draws it, centred on bid ink. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>bid Pointer promo tile</title>
    <style>
      html,
      body {
        width: 440px;
        height: 280px;
        margin: 0;
        overflow: hidden;
        background: #1d1c2c;
      }
      svg {
        display: block;
      }
    </style>
  </head>
  <body>
    <svg width="440" height="280" viewBox="0 0 440 280" aria-hidden="true">
      <defs>
        <radialGradient id="glow" cx="220" cy="140" r="200" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#ffa173" stop-opacity="0.32" />
          <stop offset="1" stop-color="#ffa173" stop-opacity="0" />
        </radialGradient>
        <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0" stop-color="#b27050" />
          <stop offset="0.5" stop-color="#ffa173" />
          <stop offset="1" stop-color="#ffba90" />
        </linearGradient>
        <!-- Pointer's pin: a square with three corners rounded off; the sharp one, bottom left, is the spot -->
        <path id="pin" d="M0 0 V-44 A44 44 0 0 1 44 -88 A44 44 0 0 1 88 -44 A44 44 0 0 1 44 0 Z" />
      </defs>
      <rect width="440" height="280" fill="url(#glow)" />

      <!-- the pin's 88 px square centred on the tile, so its round body is too -->
      <g transform="translate(176 184)">
        <use href="#pin" fill="none" stroke="#fdfcfc" stroke-width="16" stroke-linejoin="round" />
        <use href="#pin" fill="url(#gold)" stroke="#1d1c2c" stroke-width="6" stroke-linejoin="round" />
        <circle cx="44" cy="-44" r="18" fill="#fdfcfc" />
      </g>
    </svg>
  </body>
</html>
