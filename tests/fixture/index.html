<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fixture — pages-fixture staging</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; color: #111; }
      header { height: 64px; display: flex; align-items: center; padding: 0 24px; border-bottom: 1px solid #ddd; position: sticky; top: 0; background: #fff; }
      .hero { height: 520px; background: linear-gradient(135deg, #cfe8ff, #ffe6cf); display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 16px; }
      .hero h1 { font-size: 48px; margin: 0; }
      .btn-primary { padding: 14px 28px; border-radius: 999px; border: 0; background: #0a4; color: #fff; font-size: 16px; }
      .rooms { padding: 48px 24px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
      .card { border: 1px solid #ddd; border-radius: 12px; padding: 16px; height: 220px; }
      .relative { position: relative; }
      .hidden { display: none; }
      footer { height: 300px; background: #222; color: #ccc; padding: 24px; }
    </style>
  </head>
  <body>
    <header>pages-fixture</header>

    <!-- Mirrors DebugBlock.tsx output: wrapper > label div > span [Name - id] + button -->
    <div class="relative">
      <div class="hidden"><span>[ExperiencesListWithFilters - 4821]</span><button type="button">𝛥 Block Data</button></div>
      <section class="hero">
        <h1>Superior room</h1>
        <p>Sea view, 42 m², breakfast included.</p>
        <button class="btn-primary" type="button">Book now</button>
      </section>
    </div>

    <div class="relative" data-block-name="RoomList" data-block-id="77">
      <div class="hidden"><span>[RoomList - 77]</span><button type="button">𝛥 Block Data</button></div>
      <section class="rooms">
        <div class="card"><h3>Standard</h3><p>From 120 €</p></div>
        <div class="card"><h3>Superior</h3><p>From 160 €</p></div>
        <div class="card"><h3>Suite</h3><p>From 260 €</p></div>
      </section>
    </div>

    <footer>Footer without a debug block</footer>
  </body>
</html>
